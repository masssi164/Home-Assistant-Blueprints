name: Publish beta release

'on':
  push:
    branches: [main]
    paths:
      - VERSION
      - 'releases/**'
      - '.github/workflows/release-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-beta-release
  cancel-in-progress: false

jobs:
  static-and-simulated:
    if: github.repository == 'masssi164/Home-Assistant-Blueprints' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m 'not homeassistant' -q

  homeassistant-schema:
    if: github.repository == 'masssi164/Home-Assistant-Blueprints' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ha.txt
      - run: python -m pip install -r requirements-ha.txt
      - name: Validate against Home Assistant schemas
        env:
          REQUIRE_HOME_ASSISTANT: '1'
        run: python -m pytest -m homeassistant -q

  publish:
    needs: [static-and-simulated, homeassistant-schema]
    if: github.repository == 'masssi164/Home-Assistant-Blueprints' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the validated beta without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            echo 'VERSION must contain a beta tag such as v1.0.0-beta.1.' >&2
            exit 1
          fi
          notes="releases/$tag.md"
          test -s "$notes"
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\") | .html_url")"
          if [[ -n "$existing" ]]; then
            echo "Release already exists and was left unchanged: $existing"
            exit 0
          fi
          ref_sha="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")"
          if [[ -n "$ref_sha" && "$ref_sha" != "$GITHUB_SHA" ]]; then
            echo 'Existing tag differs from the validated commit; refusing to move it.' >&2
            exit 1
          fi
          gh release create "$tag" \
            blueprints/script/coffee_control/prepare_coffee.yaml \
            blueprints/script/coffee_control/coffee_recipe.yaml \
            dashboards/quick_start.yaml \
            --target "$GITHUB_SHA" \
            --title "Kaffee auf Zuruf $tag" \
            --notes-file "$notes" \
            --prerelease --latest=false
          gh release view "$tag" --json url,isPrerelease,isDraft,tagName
