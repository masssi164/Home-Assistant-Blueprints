# Beispiel zum ERSETZEN einzelner alter Einträge, nicht blind anhängen.
# Ziel-Skript-ID prüfen. Erst nach Abnahme; siehe docs/migration.md.
mach_kaffee:
  alias: Mach Kaffee
  icon: mdi:coffee
  mode: single
  sequence:
  - action: script.kaffee_auf_zuruf_zentrale
    data:
      beverage_type: Coffee
